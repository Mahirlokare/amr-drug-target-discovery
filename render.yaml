services:
  # 1. Streamlit Web Service (Free Tier)
  - type: web
    name: amr-drug-target-discovery
    runtime: python
    region: oregon
    plan: free
    buildCommand: bash render-build.sh
    startCommand: streamlit run src/app/streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_SERVER_ENABLE_CORS
        value: "false"
      - key: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
        value: "false"
      - key: MODEL_CACHE_DIR
        value: artifacts/checkpoints
      - key: MLFLOW_TRACKING_URI
        value: file:./mlruns
      - key: DATABASE_URL
        fromDatabase:
          name: amr-discovery-db
          property: connectionString

databases:
  # 2. Persistent PostgreSQL Database (Free Tier)
  - name: amr-discovery-db
    region: oregon
    plan: free
    databaseName: amr_discovery
    user: amr_admin
