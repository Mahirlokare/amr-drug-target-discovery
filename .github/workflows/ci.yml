name: AMR Drug Target Discovery CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Lint, Validate & Test Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxrender1 libxext6

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch>=2.1.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir torch-geometric>=2.5.0
          pip install -r requirements.txt
          pip install flake8

      - name: Validate Configurations & YAML Schemas
        run: |
          python -c "
          import yaml, glob
          configs = glob.glob('configs/*.yaml')
          assert len(configs) >= 5, f'Missing config files, found {len(configs)}'
          for f in configs:
              with open(f, 'r') as fp:
                  yaml.safe_load(fp)
          print(f'Successfully validated {len(configs)} YAML configuration files.')
          "

      - name: Code Syntax & Safety Lint
        run: |
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Complete Automated Test Suite (62 Tests)
        run: |
            pytest tests/ -v

  docker-build-check:
    name: Build & Verify Production Container
    runs-on: ubuntu-latest
    needs: validate-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t amr-drug-target-discovery:test .

      - name: Test Container Healthcheck
        run: |
          docker run -d --name amr-app -p 8501:8501 amr-drug-target-discovery:test
          echo "Waiting for Streamlit startup..."
          sleep 12
          curl --fail http://localhost:8501/_stcore/health || (docker logs amr-app && exit 1)
          docker stop amr-app

  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    needs: [validate-and-test, docker-build-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to Render via Webhook (Optional Trigger)
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering automated Render deployment hook..."
            curl -s -S -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "Deployment webhook triggered successfully."
          else
            echo "No RENDER_DEPLOY_HOOK_URL secret set. Render native Git push sync handles automated deploys."
          fi
