[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amr-drug-discovery"
version = "1.0.0"
description = "Antimicrobial-Resistance Drug Target Discovery with GNNs and Protein Language Models"
authors = [{ name = "DeepMind Agentic Assistant" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torch-geometric>=2.5.0",
    "rdkit>=2023.9.0",
    "scikit-learn>=1.3.0",
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "requests>=2.30.0",
    "scipy>=1.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]
